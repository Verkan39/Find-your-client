# Render Blueprint: https://render.com/docs/blueprint-spec
# Create it from the dashboard: New → Blueprint → pick this repo.
services:
  - type: web
    name: find-your-client
    runtime: node
    # Free plan (512 MB). It would normally sleep after 15 idle minutes; the app
    # pings its own /api/health every 10 minutes to stay awake (src/lib/keepalive.ts).
    # Measured: ~160 MB idle, ~340 MB peak with two 25-business scans at once.
    # For faster scans use "0.5c-512mb" ($7) or "1c-2g"; paid plans never sleep.
    plan: free
    # Pick the region closest to your Supabase project (oregon, ohio, virginia,
    # frankfurt, singapore). It can't be changed after creation.
    region: singapore
    # One instance only: background scans run inside the server process.
    numInstances: 1
    buildCommand: npm ci && npm run build
    # Heap cap only at runtime (builds get 8 GB on Render's build machines).
    startCommand: NODE_OPTIONS=--max-old-space-size=320 npm start -- -H 0.0.0.0
    healthCheckPath: /api/health
    # (maxShutdownDelaySeconds isn't allowed on the free plan. On deploys the old
    # server stops taking new work and the new one resumes unfinished scans after
    # RESUME_DELAY_MS, so nothing is lost. On a paid plan you can add
    # `maxShutdownDelaySeconds: 120` here to let in-flight businesses finish.)
    autoDeployTrigger: commit
    envVars:
      # --- Supabase (Project Settings → API Keys) ---
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Copy the SAME value you use locally if you want existing saved API keys
      # to keep working. A different value makes previously saved keys unreadable.
      - key: KEYS_ENCRYPTION_SECRET
        sync: false
      # Your live URL, e.g. https://find-your-client.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: OSM_CONTACT_EMAIL
        sync: false
      # --- Tuning ---
      - key: ANALYSIS_CONCURRENCY
        value: "2"
      - key: DAILY_BUSINESS_LIMIT
        value: "150"
      - key: GUEST_DAILY_BUSINESS_LIMIT
        value: "30"
      - key: GUEST_RETENTION_HOURS
        value: "24"
      # Keep-alive for the free plan (uses RENDER_EXTERNAL_URL, set by Render).
      - key: KEEP_ALIVE_INTERVAL_MIN
        value: "10"
